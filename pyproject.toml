[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quick_sco_re"
version = "0.3.0"
description = "SCOPE and REACH: variance-reduced event-probability estimation for autoregressive generative models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luke Solo" }]
keywords = ["monte carlo", "variance reduction", "generative event models", "electronic health records", "sglang"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# SGLang pins an exact torch build, so it is an extra: `pip install quick_sco_re` alone never
# replaces the torch you have. Generation needs [sglang]; saved scores and the HF passes do not.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
sglang = ["sglang>=0.5.10"]
hf = ["torch>=2.1", "transformers>=5.0", "safetensors>=0.4"]
cocoa = ["quick_sco_re[hf]", "polars>=1.30", "pyyaml>=6", "scikit-learn>=1.3"]
all = ["quick_sco_re[sglang,hf,cocoa]"]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/lukesolo-ml/SCOPE_REACH_optimized_inference"
Issues = "https://github.com/lukesolo-ml/SCOPE_REACH_optimized_inference/issues"
Paper = "https://arxiv.org/abs/2602.03730"

[tool.setuptools]
packages = ["quick_sco_re"]

[tool.pytest.ini_options]
testpaths = ["tests", "cocoa_example/tests"]
