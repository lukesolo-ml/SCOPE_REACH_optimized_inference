---
outcome_tokens:
  - XFR-IN//icu #ICU admission
  - RESP//imv #IMV
  - DSCG//expired #Mortality
  - LAB-RES//sodium_Q0 # Prof HypoNa
  - LAB-RES//sodium_Q9 # Sev HyperNa
  - LAB-RES//potassium_Q0 # Prof hypoK
  - LAB-RES//potassium_Q9 # HyperK
  - LAB-RES//hemoglobin_Q0 #anemia
  - LAB-RES//glucose_serum_Q0 #Hypoglycemia
  - VTL//heart_rate_Q9 #Tachycardia
  - SOFA//resp-4 #Sofa resp 4
  - SOFA//renal-4 #Sofa renal 4
  - SOFA//liver-4 #Sofa liver 4
  - SOFA//cv-4 #Sofa cardiovascular 4
  - ASMT//cam_total_positive # Positive confusion score
threshold:
  # choose one and only one of the following
  duration_s: !!int 86400 # 24h
  # first_occurrence: XFR-IN//icu
